<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Launching soon | Mappy Global Resources</title>
<meta name="robots" content="noindex, nofollow" />
<meta name="description" content="The new Mappy Global Resources site is on its way. Reach us in the meantime for executive search, niche recruitment, RPO, and contract staffing across India and the Middle East." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Kumbh+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  /* ============================ BASE ============================ */
  *, *::before, *::after { box-sizing: border-box; }

  :root {
    --navy: #1b2050;
    --orange: #ed6929;
    --indigo: #4f5bd5;
    --sand: #f0a179;
  }

  html, body { margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    background: var(--navy);
    color: #fff;
    font-family: "Kumbh Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  /* ============================ STAGE =========================== */
  .screen {
    position: relative;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    min-height: 100svh;
    padding: 40px 24px;
    overflow: hidden;
  }

  /* ======================= AMBIENT BACKGROUND =================== */
  .ambient { position: absolute; inset: 0; pointer-events: none; }

  .glow {
    position: absolute;
    border-radius: 50%;
    filter: blur(140px);
    will-change: transform;
  }

  .glow--one {
    left: -18%; top: -24%;
    width: 34rem; height: 34rem;
    background: var(--orange);
    opacity: 0.16;
    animation: drift-one 13s ease-in-out infinite alternate;
  }

  .glow--two {
    right: -16%; bottom: -26%;
    width: 32rem; height: 32rem;
    background: var(--indigo);
    opacity: 0.24;
    animation: drift-two 17s ease-in-out infinite alternate;
  }

  @keyframes drift-one { to { transform: translate(14%, -12%) scale(1.14); } }
  @keyframes drift-two { to { transform: translate(-16%, 10%) scale(1.2); } }

  #fluid {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    mix-blend-mode: screen;
  }

  .grid-overlay {
    position: absolute;
    inset: 0;
    opacity: 0.14;
    background-image:
      linear-gradient(to right, rgba(255,255,255,0.18) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255,255,255,0.18) 1px, transparent 1px);
    background-size: 72px 72px;
    -webkit-mask-image: radial-gradient(ellipse at center, black 20%, transparent 72%);
    mask-image: radial-gradient(ellipse at center, black 20%, transparent 72%);
  }

  /* ============================ LOGO ============================ */
  .masthead { position: relative; display: flex; justify-content: center; }

  .masthead img {
    height: 36px;
    width: auto;
    opacity: 0;
    animation: rise-in 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0s forwards;
  }

  /* ========================= CENTRE BLOCK ======================= */
  .centre {
    position: relative;
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 64px 0;
    text-align: center;
  }

  .tagline {
    margin: 0;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.42em;
    color: var(--sand);
    opacity: 0;
    animation: rise-in 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.25s forwards;
  }

  /* =========================== HEADLINE ========================= */
  .headline {
    position: relative;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    margin: 40px 0 0;
    font-size: 2.1rem;
    font-weight: 600;
    line-height: 1.1;
    letter-spacing: 0.22em;
    color: #fff;
  }

  .headline span { display: inline-block; position: relative; visibility: hidden; }

  .headline span.is-caret::after {
    content: "";
    position: absolute;
    top: 6%;
    bottom: 6%;
    right: -0.14em;
    width: 0.07em;
    background-color: var(--orange);
    animation: caret-blink 1s steps(1, end) infinite;
  }

  /* Solid caret while the line is still being typed. */
  .headline.is-typing span.is-caret::after { animation: none; opacity: 1; }

  @keyframes caret-blink { 0%, 49% { opacity: 1; } 50%, 99% { opacity: 0; } }

  /* ========================= PROGRESS RULE ====================== */
  .rule {
    width: 100%;
    max-width: 28rem;
    height: 1px;
    margin-top: 48px;
    background: rgba(255,255,255,0.2);
    opacity: 0;
    animation: fade-in 0.9s ease-out 1s forwards;
  }

  .rule span {
    display: block;
    height: 1px;
    width: 100%;
    background: var(--orange);
    transform-origin: left center;
    animation: fill 5.1s cubic-bezier(0.45, 0, 0.55, 1) 1.6s infinite;
  }

  @keyframes fill {
    0%   { transform: scaleX(0.04); }
    88%  { transform: scaleX(1); }
    100% { transform: scaleX(1); }
  }

  /* ============================ META ============================ */
  .meta { margin-top: 48px; display: flex; flex-direction: column; align-items: center; }

  .meta p {
    max-width: 28rem;
    margin: 0;
    font-size: 1rem;
    line-height: 2;
    color: #ffffff;
    opacity: 0;
    animation: rise-in 0.7s cubic-bezier(0.22, 1, 0.36, 1) 1.15s forwards;
  }

  .email {
    display: inline-flex;
    align-items: center;
    margin-top: 36px;
    padding: 16px 28px;
    border: 1px solid rgba(255,255,255,0.25);
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.16em;
    text-decoration: none;
    transition: background-color 0.3s, border-color 0.3s;
    opacity: 0;
    animation: rise-in 0.7s cubic-bezier(0.22, 1, 0.36, 1) 1.3s forwards;
  }

  .email:hover { background: var(--orange); border-color: var(--orange); }

  .socials {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 40px 0 0;
    padding: 0;
    list-style: none;
    opacity: 0;
    animation: rise-in 0.7s cubic-bezier(0.22, 1, 0.36, 1) 1.45s forwards;
  }

  .socials a {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 44px;
    height: 44px;
    border: 1px solid rgba(255,255,255,0.2);
    color: rgba(255,255,255,0.7);
    transition: color 0.3s, border-color 0.3s;
  }

  .socials a:hover { color: var(--orange); border-color: var(--orange); }
  .socials svg { width: 16px; height: 16px; }

  /* =========================== FOOTER =========================== */
  .foot {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.24em;
    color: rgba(255,255,255,0.4);
    text-align: center;
  }

  .foot p { margin: 0; }

  /* ========================== ANIMATIONS ======================== */
  @keyframes rise-in { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
  @keyframes fade-in { to { opacity: 1; } }

  /* =========================== CURSOR =========================== */
  .cursor { position: fixed; inset: 0; z-index: 60; pointer-events: none; opacity: 0; transition: opacity 0.3s; }
  .cursor span { position: absolute; top: 0; left: 0; border-radius: 50%; will-change: transform; }
  .cursor .ring { border: 1px solid rgba(255,255,255,0.45); }
  .cursor .dot { width: 6px; height: 6px; background: var(--orange); }
  @media (pointer: coarse) { .cursor { display: none; } }

  html.has-custom-cursor,
  html.has-custom-cursor a,
  html.has-custom-cursor button { cursor: none; }

  /* ========================== RESPONSIVE ======================== */
  @media (min-width: 640px) {
    .screen { padding: 40px; }
    .masthead img { height: 44px; }
    .tagline { font-size: 12px; letter-spacing: 0.52em; }
    .headline { font-size: 3.4rem; letter-spacing: 0.3em; }
    .rule { max-width: 32rem; }
    .meta p { font-size: 1.125rem; }
    .foot { flex-direction: row; justify-content: space-between; }
  }

  @media (min-width: 1024px) {
    .screen { padding: 40px 64px; }
    .headline { font-size: 4.6rem; }
    .glow--one { width: 46rem; height: 46rem; }
    .glow--two { width: 44rem; height: 44rem; }
  }

  /* ======================= REDUCED MOTION ======================= */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .masthead img, .tagline, .rule, .meta p, .email, .socials { opacity: 1; }
    .headline span { visibility: visible !important; }
    .headline span.is-caret::after { display: none; }
    .cursor { display: none; }
  }
</style>
</head>

  var TYPE_DELAY = 550;  // ms before typing starts

  var chars = [];

    var span = document.createElement("span");
    span.textContent = char === " " ? "  " : char;
    headline.appendChild(span);
    chars.push(span);
  });

    chars.forEach(function (span, index) {
      span.style.visibility = index < count ? "visible" : "hidden";
      span.classList.toggle("is-caret", index === count - 1);

    var ring = document.getElementById("cursorRing");
    var dot = document.getElementById("cursorDot");

    var RING_IDLE = 22, RING_HOVER = 48, MAX_INFLATE = 24;
    var px = -200, py = -200, rx = -200, ry = -200;
    var lastX = -200, lastY = -200, vel = 0;
    var hovering = false, pressed = false, shown = false, raf = 0;

      ry += (py - ry) * 0.16;

      var size = Math.max(base + Math.min(vel * (hovering ? 0.8 : 0.42), MAX_INFLATE) - (pressed ? 7 : 0), 10);

      ring.style.width = size + "px";
      ring.style.height = size + "px";
      ring.style.transform = "translate3d(" + (rx - size / 2) + "px," + (ry - size / 2) + "px,0)";
      ring.style.borderColor = hovering || pressed ? "rgba(237,105,41,0.95)" : "rgba(255,255,255,0.45)";

      dot.style.transform = "translate3d(" + (px - 3) + "px," + (py - 3) + "px,0) scale(" + (hovering ? 0.45 : 1) + ")";

      var settled = Math.abs(px - rx) < 0.15 && Math.abs(py - ry) < 0.15 && vel < 0.15;
      raf = settled ? 0 : requestAnimationFrame(cursorFrame);

      lastY = py = e.clientY;

    document.addEventListener("pointerdown", function () { pressed = true; kick(); }, { passive: true });
    document.addEventListener("pointerup", function () { pressed = false; kick(); }, { passive: true });
    document.addEventListener("pointerleave", function () { shown = false; cursor.style.opacity = "0"; });
    window.addEventListener("blur", function () { shown = false; cursor.style.opacity = "0"; });
  }
})();

  [0.31, 0.36, 0.84], // indigo

    vR = vUv + vec2(texelSize.x, 0.0);

    vB = vUv - vec2(0.0, texelSize.y);

  precision mediump float;
  precision mediump sampler2D;
  varying highp vec2 vUv;
  uniform sampler2D uTexture;
  uniform float value;

  precision highp sampler2D;
  varying vec2 vUv;
  uniform sampler2D uTarget;
  uniform float aspectRatio;
  uniform vec3 color;

  precision highp sampler2D;
  varying vec2 vUv;
  uniform sampler2D uVelocity;
  uniform sampler2D uSource;
  uniform vec2 texelSize;

  precision mediump float;
  precision mediump sampler2D;
  varying highp vec2 vUv;
  varying highp vec2 vL;
  varying highp vec2 vR;
  varying highp vec2 vT;
  varying highp vec2 vB;

    float R = texture2D(uVelocity, vR).x;
    float T = texture2D(uVelocity, vT).y;

const CURL_SHADER = `
  precision mediump float;
  precision mediump sampler2D;
  varying highp vec2 vUv;
  varying highp vec2 vL;
  varying highp vec2 vR;
  varying highp vec2 vT;
  varying highp vec2 vB;
  uniform sampler2D uVelocity;
  void main () {
    float L = texture2D(uVelocity, vL).y;
    float R = texture2D(uVelocity, vR).y;
    float T = texture2D(uVelocity, vT).x;
    float B = texture2D(uVelocity, vB).x;
    float vorticity = R - L - T + B;
    gl_FragColor = vec4(0.5 * vorticity, 0.0, 0.0, 1.0);

`;

const VORTICITY_SHADER = `
  precision highp float;
  precision highp sampler2D;
  varying vec2 vUv;
  varying vec2 vL;
  varying vec2 vR;
  varying vec2 vT;
  varying vec2 vB;
  uniform sampler2D uVelocity;
  uniform sampler2D uCurl;
  uniform float curl;
  uniform float dt;
  void main () {

    float R = texture2D(uCurl, vR).x;
    float T = texture2D(uCurl, vT).x;
    float B = texture2D(uCurl, vB).x;
    float C = texture2D(uCurl, vUv).x;
    vec2 force = 0.5 * vec2(abs(T) - abs(B), abs(R) - abs(L));
    force /= length(force) + 0.0001;
    force *= curl * C;
    force.y *= -1.0;
    vec2 velocity = texture2D(uVelocity, vUv).xy;
    velocity += force * dt;
    velocity = min(max(velocity, -1000.0), 1000.0);
    gl_FragColor = vec4(velocity, 0.0, 1.0);
  }

const PRESSURE_SHADER = `
  precision mediump float;
  precision mediump sampler2D;
  varying highp vec2 vUv;
  varying highp vec2 vL;
  varying highp vec2 vR;
  varying highp vec2 vT;
  varying highp vec2 vB;
  uniform sampler2D uPressure;
  uniform sampler2D uDivergence;
  void main () {
    float L = texture2D(uPressure, vL).x;
    float R = texture2D(uPressure, vR).x;
    float T = texture2D(uPressure, vT).x;
    float B = texture2D(uPressure, vB).x;
    float divergence = texture2D(uDivergence, vUv).x;
    float pressure = (L + R + B + T - divergence) * 0.25;
    gl_FragColor = vec4(pressure, 0.0, 0.0, 1.0);
  }
`;

const GRADIENT_SUBTRACT_SHADER = `
  precision mediump float;
  precision mediump sampler2D;
  varying highp vec2 vUv;
  varying highp vec2 vL;
  varying highp vec2 vR;
  varying highp vec2 vT;
  varying highp vec2 vB;
  uniform sampler2D uPressure;
  uniform sampler2D uVelocity;
  void main () {
    float L = texture2D(uPressure, vL).x;
    float R = texture2D(uPressure, vR).x;
    float T = texture2D(uPressure, vT).x;
    float B = texture2D(uPressure, vB).x;
    vec2 velocity = texture2D(uVelocity, vUv).xy;
    velocity.xy -= vec2(R - L, T - B);
    gl_FragColor = vec4(velocity, 0.0, 1.0);
  }
`;

const DISPLAY_SHADER = `
  precision highp float;
  precision highp sampler2D;
  varying vec2 vUv;
  uniform sampler2D uTexture;
  void main () {
    vec3 c = texture2D(uTexture, vUv).rgb;

function compileShader(gl, type, source) {

  const params = { alpha: false, depth: false, stencil: false, antialias: false, premultipliedAlpha: false };

    disposeFBO(curlFbo);

    if (document.hidden) return;
    const x = Math.random();
    const y = Math.random() * 0.6 + 0.2;
    const dx = (Math.random() - 0.5) * 900;
    const dy = (Math.random() - 0.5) * 900;
    splat(x, y, dx, dy, nextColor(0.22));
  };

  for (let i = 0; i < 5; i += 1) idleSplat();
  const idleTimer = window.setInterval(idleSplat, 2600);

  let lastTime = performance.now();
  let raf = 0;

  const step = (dt) => {
    gl.disable(gl.BLEND);

    // Curl
    gl.useProgram(programs.curl.program);
    gl.uniform2f(programs.curl.uniforms.texelSize, velocity.texelSizeX, velocity.texelSizeY);
    gl.uniform1i(programs.curl.uniforms.uVelocity, velocity.read.attach(0));
    blit(curlFbo);

    // Vorticity confinement
    gl.useProgram(programs.vorticity.program);
    gl.uniform2f(programs.vorticity.uniforms.texelSize, velocity.texelSizeX, velocity.texelSizeY);
    gl.uniform1i(programs.vorticity.uniforms.uVelocity, velocity.read.attach(0));
    gl.uniform1i(programs.vorticity.uniforms.uCurl, curlFbo.attach(1));
    gl.uniform1f(programs.vorticity.uniforms.curl, CURL);
    gl.uniform1f(programs.vorticity.uniforms.dt, dt);
    blit(velocity.write);
    velocity.swap();

    // Divergence
    gl.useProgram(programs.divergence.program);
    gl.uniform2f(programs.divergence.uniforms.texelSize, velocity.texelSizeX, velocity.texelSizeY);
    gl.uniform1i(programs.divergence.uniforms.uVelocity, velocity.read.attach(0));
    blit(divergence);

    // Decay pressure
    gl.useProgram(programs.clear.program);
    gl.uniform1i(programs.clear.uniforms.uTexture, pressure.read.attach(0));
    gl.uniform1f(programs.clear.uniforms.value, PRESSURE_DISSIPATION);
    blit(pressure.write);
    pressure.swap();

    // Jacobi pressure solve
    gl.useProgram(programs.pressure.program);
    gl.uniform2f(programs.pressure.uniforms.texelSize, velocity.texelSizeX, velocity.texelSizeY);
    gl.uniform1i(programs.pressure.uniforms.uDivergence, divergence.attach(0));

    for (let i = 0; i < PRESSURE_ITERATIONS; i += 1) {
      gl.uniform1i(programs.pressure.uniforms.uPressure, pressure.read.attach(1));
      blit(pressure.write);
      pressure.swap();
    }

    // Make the velocity field divergence-free
    gl.useProgram(programs.gradientSubtract.program);
    gl.uniform2f(
      programs.gradientSubtract.uniforms.texelSize,
      velocity.texelSizeX,
      velocity.texelSizeY
    );
    gl.uniform1i(programs.gradientSubtract.uniforms.uPressure, pressure.read.attach(0));
    gl.uniform1i(programs.gradientSubtract.uniforms.uVelocity, velocity.read.attach(1));
    blit(velocity.write);
    velocity.swap();

    // Advect velocity, then dye
    gl.useProgram(programs.advection.program);
    gl.uniform2f(programs.advection.uniforms.texelSize, velocity.texelSizeX, velocity.texelSizeY);
    const velocityId = velocity.read.attach(0);
    gl.uniform1i(programs.advection.uniforms.uVelocity, velocityId);
    gl.uniform1i(programs.advection.uniforms.uSource, velocityId);
    gl.uniform1f(programs.advection.uniforms.dt, dt);
    gl.uniform1f(programs.advection.uniforms.dissipation, VELOCITY_DISSIPATION);
    blit(velocity.write);
    velocity.swap();

    // texelSize intentionally stays at the velocity grid's scale here.
    gl.uniform1i(programs.advection.uniforms.uVelocity, velocity.read.attach(0));
    gl.uniform1i(programs.advection.uniforms.uSource, dye.read.attach(1));
    gl.uniform1f(programs.advection.uniforms.dissipation, DENSITY_DISSIPATION);
    blit(dye.write);
    dye.swap();
  };

  const render = () => {
    gl.disable(gl.BLEND);
    gl.useProgram(programs.display.program);
    gl.uniform1i(programs.display.uniforms.uTexture, dye.read.attach(0));
    blit(null);
  };

  const frame = () => {
    const now = performance.now();
    const dt = Math.min((now - lastTime) / 1000, 0.0166);
    lastTime = now;

    if (resizeCanvas()) initFramebuffers();

    if (pointer.moved) {
      pointer.moved = false;
      splat(pointer.x, pointer.y, pointer.dx, pointer.dy, nextColor(0.3));
    }

    step(dt);
    render();

    raf = requestAnimationFrame(frame);
  };

  raf = requestAnimationFrame(frame);


})();
</script>
</body>
</html>
